<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 142" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#120E22" />
    </linearGradient>

    <!-- Laser Accent Line -->
    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .font-code {
        font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI Mono', 'Cascadia Code', monospace;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 0.8s step-end infinite;
      }
    </style>

    <!-- Clip Paths for Typewriter Reveal Effect (Cycle: 5 x 3000ms = 15s) -->
    <clipPath id="clip0">
      <rect x="56" y="38" width="0" height="38">
        <animate id="c0" attributeName="width" begin="0s;c4.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

    <clipPath id="clip1">
      <rect x="56" y="38" width="0" height="38">
        <animate id="c1" attributeName="width" begin="c0.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

    <clipPath id="clip2">
      <rect x="56" y="38" width="0" height="38">
        <animate id="c2" attributeName="width" begin="c1.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

    <clipPath id="clip3">
      <rect x="56" y="38" width="0" height="38">
        <animate id="c3" attributeName="width" begin="c2.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

    <clipPath id="clip4">
      <rect x="56" y="38" width="0" height="38">
        <animate id="c4" attributeName="width" begin="c3.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="138" rx="14" fill="url(#cardBg)" stroke="#253045" stroke-width="1.8" />

  <!-- Cyber Grid Lines in Background -->
  <g opacity="0.05" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="36" x2="900" y2="36" />
    <line x1="0" y1="84" x2="900" y2="84" />
    <line x1="180" y1="0" x2="180" y2="142" />
    <line x1="450" y1="0" x2="450" y2="142" />
    <line x1="720" y1="0" x2="720" y2="142" />
  </g>

  <!-- Futuristic Corner Accents -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <path d="M 886 26 L 886 14 L 874 14" fill="none" stroke="#A855F7" stroke-width="2.5" />
  <path d="M 14 116 L 14 128 L 26 128" fill="none" stroke="#A855F7" stroke-width="2.5" />
  <path d="M 886 116 L 886 128 L 874 128" fill="none" stroke="#00F0FF" stroke-width="2.5" />

  <!-- Top Accent Laser Line -->
  <line x1="160" y1="2" x2="740" y2="2" stroke="url(#laserLine)" stroke-width="2" filter="url(#glowCyan)" />

  <!-- Top Mini Meta Header (Enlarged) -->
  <text x="36" y="24" class="font-code" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="1.5">
    &gt; HIGHLIGHTS <tspan fill="#64748B">//</tspan> <tspan fill="#C084FC">CORE_PROFILE</tspan>
  </text>
  <text x="864" y="24" text-anchor="end" class="font-code" font-size="12" font-weight="600" fill="#64748B" letter-spacing="1">
    SYS_ID: #ETML-2026
  </text>

  <!-- Prompt prefix symbol -->
  <text x="36" y="60" class="font-code" font-size="22" font-weight="800" fill="#00F0FF">&gt;</text>

  <!-- Animated Typing Lines (Enlarged to 21px, bold) -->
  <g clip-path="url(#clip0)">
    <text x="60" y="60" class="font-code" font-size="21" font-weight="700" fill="#FFFFFF">
      Hi there, I'm <tspan fill="#00F0FF" font-weight="800">Maksym Tsybulevskyi</tspan> <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <g clip-path="url(#clip1)">
    <text x="60" y="60" class="font-code" font-size="21" font-weight="700" fill="#FFFFFF">
      2nd Year Student at <tspan fill="#C084FC" font-weight="800">ETML Lausanne</tspan> <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <g clip-path="url(#clip2)">
    <text x="60" y="60" class="font-code" font-size="21" font-weight="700" fill="#FFFFFF">
      Aspiring <tspan fill="#00F0FF" font-weight="800">Frontend Developer</tspan> <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <g clip-path="url(#clip3)">
    <text x="60" y="60" class="font-code" font-size="21" font-weight="700" fill="#FFFFFF">
      <tspan fill="#4ADE80" font-weight="800">Vue.js</tspan> <tspan fill="#64748B">|</tspan> <tspan fill="#FDE047" font-weight="800">JavaScript</tspan> <tspan fill="#64748B">|</tspan> Modern Web <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <g clip-path="url(#clip4)">
    <text x="60" y="60" class="font-code" font-size="21" font-weight="700" fill="#FFFFFF">
      Building <tspan fill="#F472B6" font-weight="800">sleek</tspan> &amp; <tspan fill="#00F0FF" font-weight="800">interactive</tspan> web apps <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="78" x2="864" y2="78" stroke="#1E293B" stroke-width="1" />

  <!-- Stylized Badges (Enlarged and High Contrast) -->
  <!-- Badge 1: Focus -->
  <g transform="translate(36, 90)">
    <rect x="0" y="0" width="255" height="34" rx="7" fill="#0D131F" stroke="#00F0FF" stroke-width="1.4" stroke-opacity="0.9" />
    <path d="M 0 7 Q 0 0 7 0 L 72 0 L 72 34 L 7 34 Q 0 34 0 27 Z" fill="#00F0FF" fill-opacity="0.18" />
    <text x="13" y="22" class="font-code" font-size="12.5" font-weight="800" fill="#00F0FF" letter-spacing="1">FOCUS</text>
    <text x="82" y="22" class="font-code" font-size="13" font-weight="700" fill="#FFFFFF">Frontend Development</text>
  </g>

  <!-- Badge 2: Education -->
  <g transform="translate(311, 90)">
    <rect x="0" y="0" width="270" height="34" rx="7" fill="#0D131F" stroke="#C084FC" stroke-width="1.4" stroke-opacity="0.9" />
    <path d="M 0 7 Q 0 0 7 0 L 102 0 L 102 34 L 7 34 Q 0 34 0 27 Z" fill="#C084FC" fill-opacity="0.18" />
    <text x="13" y="22" class="font-code" font-size="12.5" font-weight="800" fill="#C084FC" letter-spacing="1">EDUCATION</text>
    <text x="110" y="22" class="font-code" font-size="13" font-weight="700" fill="#FFFFFF">ETML Lausanne (Yr 2)</text>
  </g>

  <!-- Badge 3: Status -->
  <g transform="translate(601, 90)">
    <rect x="0" y="0" width="263" height="34" rx="7" fill="#0D131F" stroke="#F472B6" stroke-width="1.4" stroke-opacity="0.9" />
    <path d="M 0 7 Q 0 0 7 0 L 80 0 L 80 34 L 7 34 Q 0 34 0 27 Z" fill="#F472B6" fill-opacity="0.18" />
    <text x="13" y="22" class="font-code" font-size="12.5" font-weight="800" fill="#F472B6" letter-spacing="1">STATUS</text>
    <text x="90" y="22" class="font-code" font-size="13" font-weight="700" fill="#FFFFFF">Open to Projects</text>
  </g>

</svg>
