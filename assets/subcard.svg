<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 135" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#120E22" />
    </linearGradient>

    <!-- Laser Accent Line -->
    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .font-code {
        font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI Mono', 'Cascadia Code', monospace;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 0.8s step-end infinite;
      }
    </style>

    <!-- Clip Paths for Typewriter Reveal Effect (Cycle: 5 x 3000ms = 15s) -->
    <clipPath id="clip0">
      <rect x="52" y="38" width="0" height="34">
        <animate id="c0" attributeName="width" begin="0s;c4.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

    <clipPath id="clip1">
      <rect x="52" y="38" width="0" height="34">
        <animate id="c1" attributeName="width" begin="c0.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

    <clipPath id="clip2">
      <rect x="52" y="38" width="0" height="34">
        <animate id="c2" attributeName="width" begin="c1.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

    <clipPath id="clip3">
      <rect x="52" y="38" width="0" height="34">
        <animate id="c3" attributeName="width" begin="c2.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

    <clipPath id="clip4">
      <rect x="52" y="38" width="0" height="34">
        <animate id="c4" attributeName="width" begin="c3.end" dur="3000ms"
                 values="0; 800; 800; 0" keyTimes="0; 0.42; 0.88; 1" fill="remove" />
      </rect>
    </clipPath>

  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="131" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Cyber Grid Lines in Background -->
  <g opacity="0.05" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="36" x2="900" y2="36" />
    <line x1="0" y1="78" x2="900" y2="78" />
    <line x1="180" y1="0" x2="180" y2="135" />
    <line x1="450" y1="0" x2="450" y2="135" />
    <line x1="720" y1="0" x2="720" y2="135" />
  </g>

  <!-- Futuristic Corner Accents -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 886 26 L 886 14 L 874 14" fill="none" stroke="#A855F7" stroke-width="2" />
  <path d="M 14 109 L 14 121 L 26 121" fill="none" stroke="#A855F7" stroke-width="2" />
  <path d="M 886 109 L 886 121 L 874 121" fill="none" stroke="#00F0FF" stroke-width="2" />

  <!-- Top Accent Laser Line -->
  <line x1="160" y1="2" x2="740" y2="2" stroke="url(#laserLine)" stroke-width="2" filter="url(#glowCyan)" />

  <!-- Top Mini Meta Header -->
  <text x="36" y="24" class="font-code" font-size="11" font-weight="600" fill="#00F0FF" letter-spacing="1.5">
    &gt; HIGHLIGHTS <tspan fill="#64748B">//</tspan> <tspan fill="#A855F7">CORE_FOCUS</tspan>
  </text>
  <text x="864" y="24" text-anchor="end" class="font-code" font-size="11" font-weight="500" fill="#64748B" letter-spacing="1">
    SYS_ID: #ETML-2026
  </text>

  <!-- Prompt prefix symbol -->
  <text x="36" y="58" class="font-code" font-size="19" font-weight="700" fill="#00F0FF">&gt;</text>

  <!-- Animated Typing Lines -->
  <g clip-path="url(#clip0)">
    <text x="56" y="58" class="font-code" font-size="18" font-weight="600" fill="#FFFFFF">
      Hi there, I'm <tspan fill="#00F0FF" font-weight="700">Maksym Tsybulevskyi</tspan> <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <g clip-path="url(#clip1)">
    <text x="56" y="58" class="font-code" font-size="18" font-weight="600" fill="#FFFFFF">
      2nd Year Student at <tspan fill="#A855F7" font-weight="700">ETML</tspan> <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <g clip-path="url(#clip2)">
    <text x="56" y="58" class="font-code" font-size="18" font-weight="600" fill="#FFFFFF">
      Aspiring <tspan fill="#00F0FF" font-weight="700">Frontend Developer</tspan> <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <g clip-path="url(#clip3)">
    <text x="56" y="58" class="font-code" font-size="18" font-weight="600" fill="#FFFFFF">
      <tspan fill="#42B883" font-weight="700">Vue.js</tspan> <tspan fill="#64748B">|</tspan> <tspan fill="#F7DF1E" font-weight="700">JavaScript</tspan> <tspan fill="#64748B">|</tspan> Modern Web <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <g clip-path="url(#clip4)">
    <text x="56" y="58" class="font-code" font-size="18" font-weight="600" fill="#FFFFFF">
      Building <tspan fill="#FF007F" font-weight="700">sleek</tspan> &amp; <tspan fill="#00F0FF" font-weight="700">interactive</tspan> interfaces <tspan class="cursor" fill="#00F0FF">█</tspan>
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="36" y1="73" x2="864" y2="73" stroke="#1E293B" stroke-width="1" />

  <!-- Stylized Badges in Cyber Frame -->
  <!-- Badge 1: Focus -->
  <g transform="translate(36, 85)">
    <rect x="0" y="0" width="255" height="30" rx="7" fill="#0E131F" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.8" />
    <path d="M 0 7 Q 0 0 7 0 L 70 0 L 70 30 L 7 30 Q 0 30 0 23 Z" fill="#00F0FF" fill-opacity="0.15" />
    <text x="12" y="19" class="font-code" font-size="11" font-weight="800" fill="#00F0FF" letter-spacing="1">FOCUS</text>
    <text x="78" y="19" class="font-code" font-size="11.5" font-weight="600" fill="#E2E8F0">Frontend Development</text>
  </g>

  <!-- Badge 2: Education -->
  <g transform="translate(311, 85)">
    <rect x="0" y="0" width="270" height="30" rx="7" fill="#0E131F" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.8" />
    <path d="M 0 7 Q 0 0 7 0 L 96 0 L 96 30 L 7 30 Q 0 30 0 23 Z" fill="#A855F7" fill-opacity="0.15" />
    <text x="12" y="19" class="font-code" font-size="11" font-weight="800" fill="#A855F7" letter-spacing="1">EDUCATION</text>
    <text x="104" y="19" class="font-code" font-size="11.5" font-weight="600" fill="#E2E8F0">ETML (Year 2)</text>
  </g>

  <!-- Badge 3: Status -->
  <g transform="translate(601, 85)">
    <rect x="0" y="0" width="263" height="30" rx="7" fill="#0E131F" stroke="#FF007F" stroke-width="1.2" stroke-opacity="0.8" />
    <path d="M 0 7 Q 0 0 7 0 L 78 0 L 78 30 L 7 30 Q 0 30 0 23 Z" fill="#FF007F" fill-opacity="0.15" />
    <text x="12" y="19" class="font-code" font-size="11" font-weight="800" fill="#FF007F" letter-spacing="1">STATUS</text>
    <text x="86" y="19" class="font-code" font-size="11.5" font-weight="600" fill="#E2E8F0">Open to Projects</text>
  </g>

</svg>
