<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#130E24" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      @keyframes scanline {
        0% { transform: translateY(-180px); }
        100% { transform: translateY(180px); }
      }
      .pulse {
        animation: pulseDot 2s ease-in-out infinite;
        transform-origin: 820px 40px;
      }
      .font-mono {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="176" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Cyber Grid Lines in Background -->
  <g opacity="0.08" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="36" x2="900" y2="36" />
    <line x1="0" y1="72" x2="900" y2="72" />
    <line x1="0" y1="108" x2="900" y2="108" />
    <line x1="0" y1="144" x2="900" y2="144" />
    <line x1="150" y1="0" x2="150" y2="180" />
    <line x1="300" y1="0" x2="300" y2="180" />
    <line x1="450" y1="0" x2="450" y2="180" />
    <line x1="600" y1="0" x2="600" y2="180" />
    <line x1="750" y1="0" x2="750" y2="180" />
  </g>

  <!-- Futuristic Corner Accents -->
  <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#00F0FF" stroke-width="3" />
  <path d="M 888 30 L 888 12 L 870 12" fill="none" stroke="#A855F7" stroke-width="3" />
  <path d="M 12 150 L 12 168 L 30 168" fill="none" stroke="#A855F7" stroke-width="3" />
  <path d="M 888 150 L 888 168 L 870 168" fill="none" stroke="#00F0FF" stroke-width="3" />

  <!-- Top Laser Glow Accent Line -->
  <line x1="100" y1="2" x2="800" y2="2" stroke="url(#laserLine)" stroke-width="3" filter="url(#glowCyan)" />

  <!-- Online Status Pill -->
  <rect x="735" y="26" width="130" height="28" rx="14" fill="#0D1B2A" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="752" cy="40" r="5" fill="#00F0FF" class="pulse" filter="url(#glowCyan)" />
  <text x="765" y="44" class="font-mono" font-size="11" font-weight="600" fill="#00F0FF" letter-spacing="1">DEV ACTIVE</text>

  <!-- Subtitle Tag -->
  <text x="50" y="52" class="font-mono" font-size="12" font-weight="600" fill="#A855F7" letter-spacing="2.5">&gt; PORTFOLIO_V2.0 // ETML_STUDENT</text>

  <!-- Main Nickname / Name -->
  <text x="48" y="105" class="font-mono" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="2">
    b1t3zzZ <tspan fill="#00F0FF" font-size="34">.</tspan><tspan fill="#A855F7" font-size="24">tsybulevskyi</tspan>
  </text>

  <!-- Role Description -->
  <text x="50" y="142" class="font-mono" font-size="14" font-weight="500" fill="#94A3B8" letter-spacing="1">
    <tspan fill="#00F0FF">Frontend Architect</tspan> • Vue.js • TypeScript • Systems (Go / C# / C++)
  </text>

  <!-- Bottom Accent Line -->
  <line x1="50" y1="160" x2="850" y2="160" stroke="url(#laserLine)" stroke-width="1" />
</svg>
