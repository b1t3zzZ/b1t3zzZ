<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#120E22" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      .pulse {
        animation: pulseDot 2s ease-in-out infinite;
        transform-origin: 755px 40px;
      }
      .font-code {
        font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI Mono', monospace;
      }
      .font-main {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="176" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.06" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="36" x2="900" y2="36" />
    <line x1="0" y1="72" x2="900" y2="72" />
    <line x1="0" y1="108" x2="900" y2="108" />
    <line x1="0" y1="144" x2="900" y2="144" />
    <line x1="180" y1="0" x2="180" y2="180" />
    <line x1="360" y1="0" x2="360" y2="180" />
    <line x1="540" y1="0" x2="540" y2="180" />
    <line x1="720" y1="0" x2="720" y2="180" />
  </g>

  <!-- Futuristic Corner Accents -->
  <path d="M 14 32 L 14 14 L 32 14" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <path d="M 886 32 L 886 14 L 868 14" fill="none" stroke="#A855F7" stroke-width="2.5" />
  <path d="M 14 148 L 14 166 L 32 166" fill="none" stroke="#A855F7" stroke-width="2.5" />
  <path d="M 886 148 L 886 166 L 868 166" fill="none" stroke="#00F0FF" stroke-width="2.5" />

  <!-- Top Accent Laser Line -->
  <line x1="120" y1="2" x2="780" y2="2" stroke="url(#laserLine)" stroke-width="2.5" filter="url(#glowCyan)" />

  <!-- Top Handle Tag -->
  <text x="50" y="45" class="font-code" font-size="14" font-weight="700" fill="#00F0FF" letter-spacing="1.5">
    &gt; @b1t3zzZ <tspan fill="#64748B">//</tspan> <tspan fill="#C084FC">ETML LAUSANNE</tspan>
  </text>

  <!-- Online Status Pill -->
  <rect x="732" y="25" width="130" height="30" rx="15" fill="#0D1B2A" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.7" />
  <circle cx="751" cy="40" r="5" fill="#00F0FF" class="pulse" filter="url(#glowCyan)" />
  <text x="766" y="44" class="font-code" font-size="12" font-weight="800" fill="#00F0FF" letter-spacing="1">ONLINE</text>

  <!-- Main Name & Surname -->
  <text x="48" y="104" class="font-main" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    Maksym Tsybulevskyi
  </text>

  <!-- Role Subtitle -->
  <text x="50" y="142" class="font-code" font-size="16" font-weight="600" fill="#CBD5E1" letter-spacing="0.8">
    <tspan fill="#00F0FF" font-weight="800">Frontend Developer</tspan> • Vue.js • TypeScript • Systems &amp; Databases (Go, C#, MySQL)
  </text>

  <!-- Bottom Accent Line -->
  <line x1="50" y1="162" x2="850" y2="162" stroke="url(#laserLine)" stroke-width="1" />
</svg>
