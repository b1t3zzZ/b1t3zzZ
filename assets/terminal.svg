    <text x="70" y="86" fill="#C084FC" font-size="18" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="206" y="86" fill="#00F0FF" font-size="18" font-weight="700">)-[</text>
    <text x="236" y="86" fill="#FFFFFF" font-size="18" font-weight="700">~</text>
    <text x="248" y="86" fill="#00F0FF" font-size="18" font-weight="700">]</text>

    <!-- Command 1 -->
    <text x="30" y="118" fill="#00F0FF" font-size="18" font-weight="700">└─$</text>
    <text x="76" y="118" fill="#FFFFFF" font-size="17.5" font-weight="700">./about_me.sh --verbose</text>

    <!-- Output 1.1: Education -->
    <text x="48" y="156" font-size="17">🎓</text>
