<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131826" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#080B11" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222938" />
      <stop offset="100%" stop-color="#161B24" />
    </linearGradient>

    <!-- Neon Laser Accent for Terminal -->
    <linearGradient id="termLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      }
    </style>
  </defs>

  <!-- Terminal Window Shadow & Frame -->
  <rect x="2" y="2" width="916" height="696" rx="14" fill="url(#termBg)" stroke="#26344B" stroke-width="2" />

  <!-- Terminal Header / Titlebar -->
  <path d="M 2 16 Q 2 2 16 2 L 904 2 Q 918 2 918 16 L 918 46 L 2 46 Z" fill="url(#termHeader)" />
  <line x1="2" y1="46" x2="918" y2="46" stroke="#334155" stroke-width="1" />
  <line x1="200" y1="46" x2="720" y2="46" stroke="url(#termLaser)" stroke-width="2" />

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="30" cy="24" r="7" fill="#FF5F56" />
  <circle cx="54" cy="24" r="7" fill="#FFBD2E" />
  <circle cx="78" cy="24" r="7" fill="#27C93F" />

  <!-- Terminal Title -->
  <text x="460" y="30" text-anchor="middle" class="font-mono" font-size="14.5" font-weight="700" fill="#CBD5E1">
    b1t3zzZ@ETML-workstation:~ (bash)
  </text>

  <!-- Session indicator on right -->
  <text x="888" y="30" text-anchor="end" class="font-mono" font-size="13" font-weight="600" fill="#64748B">
    UTF-8 // zsh
  </text>

