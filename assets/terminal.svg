    <text x="218" y="232" fill="#64748B" font-size="16.5" font-weight="700">:</text>
    <text x="236" y="232" fill="#F472B6" font-size="16.5" font-weight="700">Slick Interfaces</text>
    <text x="400" y="232" fill="#F1F5F9" font-size="16.5">• Responsive, dark/neon aesthetic</text>

