    <text x="190" y="364" fill="#64748B" font-weight="700">:</text>
    <text x="212" y="364" fill="#38BDF8" font-weight="700">Go</text>
    <text x="238" y="364" fill="#64748B">•</text>
    <text x="254" y="364" fill="#4ADE80" font-weight="700">C#</text>
    <text x="280" y="364" fill="#64748B">•</text>
    <text x="296" y="364" fill="#60A5FA" font-weight="700">C++</text>
    <text x="330" y="364" fill="#64748B">•</text>
    <text x="346" y="364" fill="#C084FC" font-weight="700">PHP</text>
    <text x="382" y="364" fill="#64748B">•</text>
    <text x="398" y="364" fill="#818CF8" font-weight="700">PowerShell</text>

    <!-- Output 2.3: Database -->
    <text x="48" y="394" fill="#FB923C" font-size="15">🗄️</text>
    <text x="76" y="394" fill="#CBD5E1" font-weight="600">Database</text>
    <text x="190" y="394" fill="#64748B" font-weight="700">:</text>
