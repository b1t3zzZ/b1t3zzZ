    <text x="318" y="508" fill="#64748B" font-size="16.5">•</text>
    <text x="336" y="508" fill="#F87171" font-size="16.5" font-weight="700">IntelliJ IDEA</text>
    <text x="466" y="508" fill="#64748B" font-size="16.5">•</text>
    <text x="484" y="508" fill="#C084FC" font-size="16.5" font-weight="700">Rider</text>
    <text x="540" y="508" fill="#64748B" font-size="16.5">•</text>
    <text x="558" y="508" fill="#FB923C" font-size="16.5" font-weight="700">Git</text>
    <text x="594" y="508" fill="#64748B" font-size="16.5">•</text>
