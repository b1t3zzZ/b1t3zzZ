    <text x="70" y="560" fill="#C084FC" font-size="18" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="206" y="560" fill="#00F0FF" font-size="18" font-weight="700">)-[</text>
    <text x="236" y="560" fill="#FFFFFF" font-size="18" font-weight="700">~</text>
    <text x="248" y="560" fill="#00F0FF" font-size="18" font-weight="700">]</text>

    <!-- Command 3 -->
    <text x="30" y="592" fill="#00F0FF" font-size="18" font-weight="700">└─$</text>
    <text x="76" y="592" fill="#FFFFFF" font-size="17.5" font-weight="700">echo $STATUS</text>

    <!-- Status Output -->
    <text x="48" y="630" fill="#38BDF8" font-size="16.5" font-weight="600">"Open to frontend challenges, internships &amp; collaborative builds."</text>
    <text x="756" y="630" fill="#00F0FF" class="cursor font-mono" font-size="18" font-weight="800">█</text>

