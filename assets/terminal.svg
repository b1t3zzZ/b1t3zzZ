    <text x="76" y="424" fill="#CBD5E1" font-weight="600">Dev Tools</text>
    <text x="190" y="424" fill="#64748B" font-weight="700">:</text>
    <text x="212" y="424" fill="#38BDF8" font-weight="700">VS Code</text>
    <text x="286" y="424" fill="#64748B">•</text>
    <text x="302" y="424" fill="#F87171" font-weight="700">IntelliJ IDEA</text>
    <text x="418" y="424" fill="#64748B">•</text>
    <text x="434" y="424" fill="#C084FC" font-weight="700">Rider</text>
    <text x="484" y="424" fill="#64748B">•</text>
    <text x="500" y="424" fill="#FB923C" font-weight="700">Git</text>
    <text x="532" y="424" fill="#64748B">•</text>
    <text x="548" y="424" fill="#FFFFFF" font-weight="700">GitHub</text>


    <!-- === SECTION 3: CURRENT STATUS === -->
    <!-- Prompt 3 -->
    <text x="28" y="470" fill="#00F0FF" font-size="15.5" font-weight="700">┌──(</text>
    <text x="62" y="470" fill="#C084FC" font-size="15.5" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="178" y="470" fill="#00F0FF" font-size="15.5" font-weight="700">)-[</text>
    <text x="204" y="470" fill="#FFFFFF" font-size="15.5" font-weight="700">~</text>
    <text x="214" y="470" fill="#00F0FF" font-size="15.5" font-weight="700">]</text>

    <!-- Command 3 -->
    <text x="28" y="498" fill="#00F0FF" font-size="15.5" font-weight="700">└─$</text>
    <text x="68" y="498" fill="#FFFFFF" font-size="15.5" font-weight="700">echo $STATUS</text>

    <!-- Status Output -->
    <text x="48" y="530" fill="#38BDF8" font-size="15" font-weight="600">"Open to frontend challenges, internship opportunities &amp; collaborative builds."</text>
    <text x="758" y="530" fill="#00F0FF" class="cursor font-mono" font-size="17" font-weight="800">█</text>

    <!-- Session active footer line -->
    <text x="48" y="562" fill="#64748B" font-size="12">// Session active: ready for input...</text>
  </g>
</svg>
