<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#212733" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Neon Laser Accent for Terminal -->
    <linearGradient id="termLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      }
    </style>
  </defs>

  <!-- Terminal Window Shadow & Frame -->
  <rect x="2" y="2" width="896" height="586" rx="14" fill="url(#termBg)" stroke="#253045" stroke-width="1.8" />

  <!-- Terminal Header / Titlebar -->
  <path d="M 2 16 Q 2 2 16 2 L 884 2 Q 898 2 898 16 L 898 42 L 2 42 Z" fill="url(#termHeader)" />
  <line x1="2" y1="42" x2="898" y2="42" stroke="#30363D" stroke-width="1" />
  <line x1="200" y1="42" x2="700" y2="42" stroke="url(#termLaser)" stroke-width="1.8" />

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="28" cy="22" r="6.5" fill="#FF5F56" />
  <circle cx="50" cy="22" r="6.5" fill="#FFBD2E" />
  <circle cx="72" cy="22" r="6.5" fill="#27C93F" />

  <!-- Terminal Title -->
  <text x="450" y="27" text-anchor="middle" class="font-mono" font-size="13" font-weight="700" fill="#94A3B8">
    b1t3zzZ@ETML-workstation:~ (bash)
  </text>

  <!-- Session indicator on right -->
  <text x="872" y="27" text-anchor="end" class="font-mono" font-size="12" font-weight="600" fill="#64748B">
    UTF-8 // zsh
  </text>

  <!-- Terminal Content Lines (Enlarged and High Contrast) -->
  <g class="font-mono" font-size="15">

    <!-- === SECTION 1: ABOUT ME / PROFILE === -->
    <!-- Prompt 1 -->
    <text x="28" y="74" fill="#00F0FF" font-size="15.5" font-weight="700">┌──(</text>
    <text x="62" y="74" fill="#C084FC" font-size="15.5" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="178" y="74" fill="#00F0FF" font-size="15.5" font-weight="700">)-[</text>
    <text x="204" y="74" fill="#FFFFFF" font-size="15.5" font-weight="700">~</text>
    <text x="214" y="74" fill="#00F0FF" font-size="15.5" font-weight="700">]</text>

    <!-- Command 1 -->
    <text x="28" y="102" fill="#00F0FF" font-size="15.5" font-weight="700">└─$</text>
    <text x="68" y="102" fill="#FFFFFF" font-size="15.5" font-weight="700">./about_me.sh --verbose</text>

    <!-- Output 1.1: Education -->
    <text x="48" y="136" fill="#38BDF8" font-size="15">🎓</text>
    <text x="76" y="136" fill="#CBD5E1" font-weight="600">Education</text>
    <text x="190" y="136" fill="#64748B" font-weight="700">:</text>
    <text x="212" y="136" fill="#38BDF8" font-weight="700">ETML Lausanne</text>
    <text x="342" y="136" fill="#94A3B8">(École Technique des Métiers de Lausanne) • 2nd Year CS</text>

    <!-- Output 1.2: Focus -->
    <text x="48" y="166" fill="#00F0FF" font-size="15">🎯</text>
    <text x="76" y="166" fill="#CBD5E1" font-weight="600">Main Focus</text>
    <text x="190" y="166" fill="#64748B" font-weight="700">:</text>
    <text x="212" y="166" fill="#00F0FF" font-weight="700">Modern Frontend</text>
    <text x="362" y="166" fill="#E2E8F0">• Reactive Architecture &amp; Component Engineering</text>

    <!-- Output 1.3: UI/UX -->
    <text x="48" y="196" fill="#F472B6" font-size="15">🎨</text>
    <text x="76" y="196" fill="#CBD5E1" font-weight="600">UI/UX Design</text>
    <text x="190" y="196" fill="#64748B" font-weight="700">:</text>
    <text x="212" y="196" fill="#F472B6" font-weight="700">Slick Interfaces</text>
    <text x="362" y="196" fill="#E2E8F0">• Smooth animations, dark/neon aesthetic &amp; performance</text>

    <!-- Output 1.4: Philosophy -->
    <text x="48" y="226" fill="#C084FC" font-size="15">💡</text>
    <text x="76" y="226" fill="#CBD5E1" font-weight="600">Philosophy</text>
    <text x="190" y="226" fill="#64748B" font-weight="700">:</text>
    <text x="212" y="226" fill="#F1F5F9">Clean, readable, maintainable code &amp; continuous learning</text>


