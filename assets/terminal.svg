<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F242C" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Neon Laser Accent for Terminal -->
    <linearGradient id="termLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      }
    </style>
  </defs>

  <!-- Terminal Window Shadow & Frame -->
  <rect x="2" y="2" width="896" height="516" rx="14" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Terminal Header / Titlebar -->
  <path d="M 2 16 Q 2 2 16 2 L 884 2 Q 898 2 898 16 L 898 38 L 2 38 Z" fill="url(#termHeader)" />
  <line x1="2" y1="38" x2="898" y2="38" stroke="#30363D" stroke-width="1" />
  <line x1="250" y1="38" x2="650" y2="38" stroke="url(#termLaser)" stroke-width="1.5" />

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="26" cy="20" r="6" fill="#FF5F56" />
  <circle cx="46" cy="20" r="6" fill="#FFBD2E" />
  <circle cx="66" cy="20" r="6" fill="#27C93F" />

  <!-- Terminal Title -->
  <text x="450" y="25" text-anchor="middle" class="font-mono" font-size="12" font-weight="600" fill="#8B949E">
    b1t3zzZ@ETML-workstation:~ (bash)
  </text>

  <!-- Session indicator on right -->
  <text x="874" y="25" text-anchor="end" class="font-mono" font-size="11" font-weight="500" fill="#64748B">
    UTF-8 // zsh
  </text>

  <!-- Terminal Content Lines -->
  <g class="font-mono" font-size="13">

    <!-- === SECTION 1: ABOUT ME / PROFILE === -->
    <!-- Prompt 1 -->
    <text x="26" y="66" fill="#00F0FF" font-weight="700">┌──(</text>
    <text x="58" y="66" fill="#A855F7" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="162" y="66" fill="#00F0FF" font-weight="700">)-[</text>
    <text x="186" y="66" fill="#FFFFFF" font-weight="700">~</text>
    <text x="194" y="66" fill="#00F0FF" font-weight="700">]</text>

    <!-- Command 1 -->
    <text x="26" y="90" fill="#00F0FF" font-weight="700">└─$</text>
    <text x="62" y="90" fill="#E6EDF3" font-weight="600">./whoami.sh --verbose</text>

    <!-- Bio Outputs -->
    <g transform="translate(26, 0)">
      <!-- Line 1: Education -->
      <text x="0" y="118" fill="#58A6FF" font-weight="700">[🎓]</text>
      <text x="32" y="118" fill="#8B949E">Education:</text>
      <text x="180" y="118" fill="#58A6FF" font-weight="600">ETML Lausanne</text>
      <text x="296" y="118" fill="#94A3B8">(École Technique des Métiers de Lausanne) • 2nd Year CS</text>

      <!-- Line 2: Focus -->
      <text x="0" y="142" fill="#00F0FF" font-weight="700">[🎯]</text>
      <text x="32" y="142" fill="#8B949E">Primary Focus:</text>
      <text x="180" y="142" fill="#00F0FF" font-weight="600">Modern Frontend</text>
      <text x="322" y="142" fill="#94A3B8">• Vue.js &amp; Reactive Component Architecture</text>

      <!-- Line 3: UI/UX -->
      <text x="0" y="166" fill="#FF007F" font-weight="700">[🎨]</text>
      <text x="32" y="166" fill="#8B949E">UI/UX &amp; Style:</text>
      <text x="180" y="166" fill="#FF79C6" font-weight="600">Slick Interfaces</text>
      <text x="312" y="166" fill="#94A3B8">• Smooth responsiveness &amp; dark/neon cyberpunk aesthetics</text>

      <!-- Line 4: Philosophy -->
      <text x="0" y="190" fill="#A855F7" font-weight="700">[💡]</text>
      <text x="32" y="190" fill="#8B949E">Philosophy:</text>
      <text x="180" y="190" fill="#E2E8F0">Clean, maintainable code &amp; continuous learning of modern web standards</text>
    </g>

    <!-- === SECTION 2: TECH STACK & TOOLS === -->
    <!-- Prompt 2 -->
    <text x="26" y="228" fill="#00F0FF" font-weight="700">┌──(</text>
    <text x="58" y="228" fill="#A855F7" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="162" y="228" fill="#00F0FF" font-weight="700">)-[</text>
    <text x="186" y="228" fill="#FFFFFF" font-weight="700">~/stack</text>
    <text x="242" y="228" fill="#00F0FF" font-weight="700">]</text>

    <!-- Command 2 -->
    <text x="26" y="252" fill="#00F0FF" font-weight="700">└─$</text>
    <text x="62" y="252" fill="#E6EDF3" font-weight="600">dev-stack --list-all --categories</text>

    <!-- Tech Stack Outputs -->
    <g transform="translate(26, 0)">
      <!-- Line 1: Frontend -->
      <text x="0" y="280" fill="#42B883" font-weight="700">[🌐]</text>
      <text x="32" y="280" fill="#8B949E">Frontend:</text>
      <text x="180" y="280" fill="#42B883" font-weight="700">Vue.js</text>
      <text x="238" y="280" fill="#64748B">•</text>
      <text x="254" y="280" fill="#F7DF1E" font-weight="700">JavaScript (ES6+)</text>
      <text x="400" y="280" fill="#64748B">•</text>
      <text x="416" y="280" fill="#E34F26" font-weight="700">HTML5</text>
      <text x="468" y="280" fill="#64748B">•</text>
      <text x="484" y="280" fill="#1572B6" font-weight="700">CSS3</text>
      <text x="528" y="280" fill="#64748B">•</text>
      <text x="544" y="280" fill="#94A3B8">Modern Web Standards</text>

      <!-- Line 2: Backend & Systems -->
      <text x="0" y="306" fill="#A855F7" font-weight="700">[⚙️]</text>
      <text x="32" y="306" fill="#8B949E">Backend &amp; Sys:</text>
      <text x="180" y="306" fill="#00ADD8" font-weight="700">Go</text>
      <text x="206" y="306" fill="#64748B">•</text>
      <text x="222" y="306" fill="#239120" font-weight="700">C#</text>
      <text x="248" y="306" fill="#64748B">•</text>
      <text x="264" y="306" fill="#00599C" font-weight="700">C++</text>
      <text x="298" y="306" fill="#64748B">•</text>
      <text x="314" y="306" fill="#777BB4" font-weight="700">PHP</text>
      <text x="348" y="306" fill="#64748B">•</text>
      <text x="364" y="306" fill="#5391FE" font-weight="700">PowerShell</text>

      <!-- Line 3: Database -->
      <text x="0" y="332" fill="#F0883E" font-weight="700">[🗄️]</text>
      <text x="32" y="332" fill="#8B949E">Database Layer:</text>
      <text x="180" y="332" fill="#F0883E" font-weight="700">MySQL</text>
      <text x="232" y="332" fill="#94A3B8">(Relational Schema Design, Optimization &amp; Queries)</text>

      <!-- Line 4: Tools & IDEs -->
      <text x="0" y="358" fill="#2DD4BF" font-weight="700">[🧰]</text>
      <text x="32" y="358" fill="#8B949E">Dev Environment:</text>
      <text x="180" y="358" fill="#007ACC" font-weight="600">VS Code</text>
      <text x="248" y="358" fill="#64748B">•</text>
      <text x="264" y="358" fill="#F87171" font-weight="600">IntelliJ IDEA</text>
      <text x="372" y="358" fill="#64748B">•</text>
      <text x="388" y="358" fill="#C084FC" font-weight="600">Rider</text>
      <text x="436" y="358" fill="#64748B">•</text>
      <text x="452" y="358" fill="#F05032" font-weight="600">Git</text>
      <text x="484" y="358" fill="#64748B">•</text>
      <text x="500" y="358" fill="#E2E8F0" font-weight="600">GitHub</text>
    </g>

    <!-- === SECTION 3: CURRENT STATUS === -->
    <!-- Prompt 3 -->
    <text x="26" y="400" fill="#00F0FF" font-weight="700">┌──(</text>
    <text x="58" y="400" fill="#A855F7" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="162" y="400" fill="#00F0FF" font-weight="700">)-[</text>
    <text x="186" y="400" fill="#FFFFFF" font-weight="700">~</text>
    <text x="194" y="400" fill="#00F0FF" font-weight="700">]</text>

    <!-- Command 3 -->
    <text x="26" y="424" fill="#00F0FF" font-weight="700">└─$</text>
    <text x="62" y="424" fill="#E6EDF3" font-weight="600">echo $STATUS</text>

    <!-- Status Output with Blinking Cursor -->
    <text x="26" y="454" fill="#79C0FF" font-weight="500">"Always learning, open to frontend challenges, internships &amp; collaborative builds."</text>
    <text x="764" y="454" fill="#00F0FF" class="cursor font-mono" font-size="15" font-weight="800">█</text>

    <!-- Interactive hint / prompt -->
    <text x="26" y="488" fill="#64748B" font-size="11.5">// Session active: ready for input...</text>
  </g>
</svg>
