    <!-- Prompt 2 -->
    <text x="28" y="272" fill="#00F0FF" font-size="15.5" font-weight="700">┌──(</text>
    <text x="62" y="272" fill="#C084FC" font-size="15.5" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="178" y="272" fill="#00F0FF" font-size="15.5" font-weight="700">)-[</text>
    <text x="204" y="272" fill="#FFFFFF" font-size="15.5" font-weight="700">~/tech-stack</text>
    <text x="312" y="272" fill="#00F0FF" font-size="15.5" font-weight="700">]</text>

    <!-- Command 2 -->
    <text x="28" y="300" fill="#00F0FF" font-size="15.5" font-weight="700">└─$</text>
    <text x="68" y="300" fill="#FFFFFF" font-size="15.5" font-weight="700">dev-stack --show-categories</text>

    <!-- Output 2.1: Frontend -->
    <text x="48" y="334" fill="#4ADE80" font-size="15">🌐</text>
    <text x="76" y="334" fill="#CBD5E1" font-weight="600">Frontend</text>
    <text x="190" y="334" fill="#64748B" font-weight="700">:</text>
    <text x="212" y="334" fill="#4ADE80" font-weight="700">Vue.js</text>
    <text x="270" y="334" fill="#64748B">•</text>
    <text x="286" y="334" fill="#FDE047" font-weight="700">JavaScript (ES6+)</text>
    <text x="444" y="334" fill="#64748B">•</text>
    <text x="460" y="334" fill="#FB923C" font-weight="700">HTML5</text>
    <text x="514" y="334" fill="#64748B">•</text>
    <text x="530" y="334" fill="#38BDF8" font-weight="700">CSS3</text>
    <text x="576" y="334" fill="#64748B">•</text>
