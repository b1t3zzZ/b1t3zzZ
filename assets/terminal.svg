<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262D" />
      <stop offset="100%" stop-color="#1B1F27" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      }
    </style>
  </defs>

  <!-- Terminal Window Shadow & Frame -->
  <rect x="2" y="2" width="846" height="336" rx="12" fill="url(#termBg)" stroke="#30363D" stroke-width="1.5" />

  <!-- Terminal Header / Titlebar -->
  <path d="M 2 14 Q 2 2 14 2 L 836 2 Q 848 2 848 14 L 848 38 L 2 38 Z" fill="url(#termHeader)" />
  <line x1="2" y1="38" x2="848" y2="38" stroke="#30363D" stroke-width="1" />

  <!-- Window Control Buttons (macOS style) -->
  <circle cx="24" cy="20" r="6" fill="#FF5F56" />
  <circle cx="44" cy="20" r="6" fill="#FFBD2E" />
  <circle cx="64" cy="20" r="6" fill="#27C93F" />

  <!-- Terminal Title -->
  <text x="425" y="25" text-anchor="middle" class="font-mono" font-size="12" font-weight="600" fill="#8B949E">
    b1t3zzZ@ETML-desktop:~ (bash)
  </text>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Prompt 1 -->
  <g class="font-mono" font-size="13">
    <text x="24" y="66" fill="#00F0FF" font-weight="700">┌──(</text>
    <text x="56" y="66" fill="#A855F7" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="160" y="66" fill="#00F0FF" font-weight="700">)-[</text>
    <text x="184" y="66" fill="#FFFFFF" font-weight="700">~</text>
    <text x="192" y="66" fill="#00F0FF" font-weight="700">]</text>

    <!-- Line 2: Command -->
    <text x="24" y="90" fill="#00F0FF" font-weight="700">└─$</text>
    <text x="60" y="90" fill="#E6EDF3" font-weight="600">./init_profile.sh --target=frontend --verbose</text>

    <!-- Line 3: Outputs -->
    <text x="24" y="122" fill="#2DD4BF" font-weight="700">[✔]</text>
    <text x="56" y="122" fill="#8B949E">Education:</text>
    <text x="220" y="122" fill="#58A6FF" font-weight="600">ETML Lausanne</text>
    <text x="340" y="122" fill="#8B949E">(Computer Science, Year 2)</text>

    <text x="24" y="148" fill="#2DD4BF" font-weight="700">[✔]</text>
    <text x="56" y="148" fill="#8B949E">Primary Focus:</text>
    <text x="220" y="148" fill="#00F0FF" font-weight="600">Modern Frontend (Vue.js 3, JavaScript, Responsive UI)</text>

    <text x="24" y="174" fill="#2DD4BF" font-weight="700">[✔]</text>
    <text x="56" y="174" fill="#8B949E">Systems &amp; Languages:</text>
    <text x="220" y="174" fill="#A855F7" font-weight="600">Go, C#, C++, PHP, PowerShell</text>

    <text x="24" y="200" fill="#2DD4BF" font-weight="700">[✔]</text>
    <text x="56" y="200" fill="#8B949E">Database Layer:</text>
    <text x="220" y="200" fill="#F0883E" font-weight="600">MySQL (Relational DB Design)</text>

    <text x="24" y="226" fill="#FF79C6" font-weight="700">[⚡]</text>
    <text x="56" y="226" fill="#8B949E">Engineering Goal:</text>
    <text x="220" y="226" fill="#7EE787" font-weight="600">Crafting high-performance, sleek and reactive web apps</text>

    <!-- Line 4: Prompt 2 -->
    <text x="24" y="262" fill="#00F0FF" font-weight="700">┌──(</text>
    <text x="56" y="262" fill="#A855F7" font-weight="700">b1t3zzZ㉿ETML</text>
    <text x="160" y="262" fill="#00F0FF" font-weight="700">)-[</text>
    <text x="184" y="262" fill="#FFFFFF" font-weight="700">~</text>
    <text x="192" y="262" fill="#00F0FF" font-weight="700">]</text>

    <!-- Line 5: Echo Status -->
    <text x="24" y="286" fill="#00F0FF" font-weight="700">└─$</text>
    <text x="60" y="286" fill="#E6EDF3" font-weight="600">echo $STATUS</text>

    <text x="24" y="312" fill="#79C0FF">"Open to frontend challenges, internship opportunities &amp; collaborative builds."</text>
    <text x="736" y="312" fill="#00F0FF" class="cursor font-mono" font-size="15" font-weight="800">█</text>
  </g>
</svg>
